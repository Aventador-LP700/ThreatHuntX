worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    server_tokens off;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 8k;
    server {
        listen 8080 default_server;
        server_name localhost 127.0.0.1;
        if ($host !~ ^(localhost|127\.0\.0\.1)$) { return 421; }
        root /usr/share/nginx/html;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        location /api/ {
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $backend api:8000;
            proxy_pass http://$backend$request_uri;
            proxy_set_header Host $http_host;
        }
        location / { try_files $uri $uri/ =404; }
    }
}
