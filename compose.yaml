name: threathuntx
services:
  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    environment:
      THREATHUNTX_DB: /var/lib/threathuntx/lab.sqlite
    volumes:
      - lab-data:/var/lib/threathuntx
    networks: [lab]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, python, -c, "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/health', timeout=2).read()"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    ports:
      - "127.0.0.1:${THREATHUNTX_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    networks: [edge, lab]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: [CMD-SHELL, "wget -Y off -qO /dev/null http://127.0.0.1:8080/api/health"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  lab-data:
networks:
  edge:
  lab:
    internal: true
