name: Detection-as-code and Community Lab

on:
  push:
    branches: [main, community-alpha]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: 0.13.9
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.3
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: |
          uv sync --locked --python 3.12
          npm --prefix frontend ci
          mkdir -p build/validation
      - name: Validate source and generated artifacts
        run: |
          uv run --locked ruff check
          uv run --locked ruff format --check
          bash -n scripts/setup.sh
          docker compose config --quiet
          uv export --locked --no-dev --no-emit-project --no-header > build/validation/requirements.txt
          diff -u infra/docker/requirements.txt build/validation/requirements.txt
          uv run --locked python -m scripts.build_schemas --check
          uv run --locked python -m scripts.build_detection_artifacts --check
          uv run --locked python -m scripts.verify_attack
          uv run --locked python -m scripts.build_learning_docs --check
          uv run --locked python -m scripts.check_docs
      - name: Run unit, API, and detection validation tests
        run: |
          uv run --locked pytest --junitxml=build/validation/pytest.xml
          uv run --locked python -m app.cli verify > build/validation/fixture-results.json
          uv run --locked python -m scripts.vendor_samples all > build/validation/vendor-samples.json
      - name: Verify optional YARA text samples
        run: uv run --locked --extra forensics python -m scripts.check_yara_samples > build/validation/yara-samples.json
      - name: Scan application source, dependencies, and history
        run: |
          uv run --locked bandit -q -r backend/app
          uv run --locked pip-audit --require-hashes --disable-pip -r infra/docker/requirements.txt
          npm --prefix frontend audit --audit-level=high
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -fsSLo "$archive" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          printf '%s  %s\n' 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb "$archive" | sha256sum -c
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner .
      - name: Build frontend and generate SBOMs
        run: |
          npm --prefix frontend run build
          uv run --locked cyclonedx-py requirements --output-reproducible infra/docker/requirements.txt --output-file build/validation/python.cdx.json
          npm --prefix frontend sbom --omit=dev --sbom-format=cyclonedx > build/validation/web.cdx.json
      - name: Package the review candidate and verify checksums
        run: |
          ./scripts/package-release.sh
          (cd build/release && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: community-v2-candidate
          path: build/release/
          if-no-files-found: error
      - name: Write validation summary
        if: always()
        run: |
          uv run --locked python -m scripts.ci_summary build/validation >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: validation
          path: build/validation/
          if-no-files-found: warn

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: 0.13.9
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.3
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --locked --python 3.12
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend exec -- playwright install --with-deps chromium
      - name: Start and verify the clean Community Lab
        run: |
          docker compose up -d --build --wait --wait-timeout 120
          curl -fsS http://127.0.0.1:8080/api/health
          npm --prefix frontend run test:e2e
          ./scripts/setup.sh reset
      - name: Smoke the static showcase under a project subpath
        run: |
          make showcase
          python -m http.server 4173 --bind 127.0.0.1 --directory public-demo > /tmp/threathuntx-pages.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          curl --retry 8 --retry-connrefused --retry-delay 1 -fsS http://127.0.0.1:4173/dist/ > /dev/null
          THX_SHOWCASE=1 THX_URL=http://127.0.0.1:4173/dist/ npm --prefix frontend run test:e2e
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: read-only-showcase
          path: public-demo/dist/
          include-hidden-files: true
          if-no-files-found: error
      - name: Logs and teardown
        if: always()
        run: |
          docker compose logs --no-color api web
          docker compose down
