[project]
name = "threathuntx"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = ["fastapi>=0.120", "uvicorn>=0.38", "pydantic>=2.12"]

[dependency-groups]
dev = ["httpx>=0.28", "pytest>=9", "ruff>=0.14", "pysigma>=0.11", "pip-audit>=2.9", "bandit>=1.8", "cyclonedx-bom>=7"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["backend", "."]
testpaths = ["backend/tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
