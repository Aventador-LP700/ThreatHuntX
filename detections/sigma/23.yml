title: Ransomware-like activity observation
name: threathuntx_23
id: 3841320c-81d1-5c22-a98e-74332bda05b6
status: test
description: Four distinct renames to one unexpected extension pattern on a shared
  document host in two minutes warrant rapid triage.
references:
- https://attack.mitre.org/techniques/T1486
author: ThreatHuntX contributors
license: MIT
tags:
- attack.t1486
logsource:
  product: windows
  definition: Windows security or Sysmon projection; ThreatHuntX normalized field
    mapping required
detection:
