title: MFA Fatigue observation
name: threathuntx_02
id: a2fc4253-48ce-517a-87d7-5e9983583b24
status: test
description: Three distinct denied push prompts for one user within five minutes warrant
  investigation.
references:
- https://attack.mitre.org/techniques/T1621
author: ThreatHuntX contributors
license: MIT
tags:
- attack.t1621
logsource:
  product: azure
  service: signinlogs
  definition: Entra sign-in or audit projection; ThreatHuntX normalized field mapping
    required
detection:
  selection:
    THXSource: identity
    THXAction: mfa_challenge
    THXOutcome: denied
    THXAuthMethod: push
  condition: selection and not 1 of filter_*
  filter_0:
    THXChangeContext: approved_enrollment
falsepositives:
- Someone re-enrolling a phone can deny repeated prompts. An approved enrollment test
  is recorded with a change context.
level: medium
